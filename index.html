<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>NaijaVerse RP</title>
<style>
  html, body { margin: 0; height: 100%; background: #14202b; overflow: hidden; font-family: Georgia, serif; }
  #game { width: 100%; height: 100%; touch-action: none; }
  #game canvas { display: block; }
  #auth {
    position: fixed; inset: 0; z-index: 10; display: none; flex-direction: column; align-items: center;
    overflow-y: auto; padding: 14px; box-sizing: border-box;
    background: radial-gradient(ellipse at top, #24435c, #0d1620 70%); color: #f3eedd;
  }
  #auth .logo { font-size: 38px; font-weight: bold; color: #fff; text-shadow: 0 2px 0 #000; margin-top: auto; padding-bottom: 12px; }
  #auth .logo b { color: #ffd23f; }
  #auth .logo small { display: block; font-size: 16px; color: #ffd23f; text-align: right; }
  #auth.choosing .logo { display: none; }
  .panel { display: none; flex-direction: column; gap: 10px; width: min(360px, 92vw); padding: 22px; box-sizing: border-box;
    background: #1d2f3e; border: 1px solid #3a566d; border-radius: 12px; margin-bottom: auto; }
  .panel h1 { margin: 0 0 4px; font-size: 22px; font-weight: normal; }
  .panel h1 b { color: #ffd23f; }
  .panel input { font: inherit; font-size: 16px; padding: 10px; border-radius: 6px; border: 1px solid #3a566d; background: #14202b; color: #fff; }
  .panel label { font-size: 13px; color: #b9c7d2; }
  button.big { font: inherit; font-size: 17px; padding: 14px; border: 0; border-radius: 28px; background: #ffd23f; color: #111; font-weight: bold; cursor: pointer; }
  button.alt { font: inherit; font-size: 16px; padding: 12px; border-radius: 28px; background: transparent; color: #fff; border: 1px solid #3a566d; cursor: pointer; }
  #authMsg { min-height: 20px; font-size: 14px; color: #ffd9a0; text-align: center; max-width: 90vw; padding-top: 8px; }

  /* choose your character: always fits the screen; tabs on top, big preview, 3 outfits, Play at the bottom */
  #auth.choosing { padding: 0; justify-content: flex-start; overflow: hidden; }
  #pChoose { width: 100%; max-width: 560px; height: 100%; margin: 0 auto; border: 0; border-radius: 0; background: transparent;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); gap: 8px; }
  #pChoose h1 { text-align: center; margin: 0; font-size: 20px; }
  .tabs { display: flex; gap: 8px; }
  .tabs button { flex: 1; font: inherit; font-size: 17px; padding: 12px; border-radius: 10px; border: 2px solid #3a566d; background: #14202b; color: #fff; cursor: pointer; }
  .tabs button.on { border-color: #ffd23f; color: #ffd23f; background: #1d2f3e; }
  #stage { flex: 1; min-height: 120px; border-radius: 12px; background: radial-gradient(ellipse at 50% 85%, #2c4a63, #14202b 70%); overflow: hidden; }
  #prev { width: 100%; height: 100%; display: block; }
  #cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .card { font: inherit; font-size: 15px; padding: 14px 6px; border-radius: 10px; border: 2px solid #3a566d; background: #14202b; color: #fff; cursor: pointer; }
  .card.on { border-color: #ffd23f; color: #ffd23f; background: #1d2f3e; }
</style>

<!-- Three.js (the 3D engine) is loaded from the internet, no install needed -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="game"></div>

<div id="auth">
  <div class="logo">Naija<b>Verse</b><small>RP</small></div>

  <div class="panel" id="pLanding">
    <h1>Welcome <b>Back!</b></h1>
    <label for="authEmail">Email</label>
    <input id="authEmail" type="email" autocomplete="email">
    <label for="authPass">Password</label>
    <input id="authPass" type="password" autocomplete="current-password">
    <button class="big" id="btnLogin">Log In</button>
    <button class="alt" id="btnCreate">Create New Account</button>
  </div>

  <div class="panel" id="pSignup">
    <h1>Create your <b>account</b></h1>
    <label>Use the email and password above</label>
    <button class="big" id="btnSignup">Continue</button>
    <button class="alt" id="btnBack">Back</button>
  </div>

  <div class="panel" id="pChoose">
    <h1>Choose Your <b>Character</b></h1>
    <div class="tabs"><button id="tabMale">Male</button><button id="tabFemale">Female</button></div>
    <div id="stage"><canvas id="prev"></canvas></div>
    <div id="cards"></div>
    <button class="big" id="btnPlay">Play</button>
  </div>

  <div id="authMsg"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script type="module" src="game.js"></script>
</body>
</html>
