<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>NaijaVerse RP</title>
<style>
:root { --navy:#0b1a33; --navy2:#10264a; --line:#1f4a8a; --gold:#ffc61a; --txt:#f3f6ff; --mut:#9fb3d1; }
* { box-sizing:border-box; }
html, body { margin:0; height:100%; background:#0b1a33; overflow:hidden; font-family:"Segoe UI", system-ui, Arial, sans-serif; }
#game { width:100%; height:100%; touch-action:none; }
#game canvas { display:block; }

/* ================= AUTH ================= */
#auth { position:fixed; inset:0; z-index:10; display:none; flex-direction:column; align-items:center; overflow-y:auto; color:var(--txt);
  padding:calc(12px + env(safe-area-inset-top)) 14px 12px;
  background:linear-gradient(180deg, rgba(11,26,51,0) 40%, rgba(11,26,51,.75) 100%), url("assets/bg.jpg") center bottom / cover no-repeat #0b1a33; }
.logo { width:min(86vw,520px); max-height:24vh; object-fit:contain; margin-top:auto; padding-bottom:14px; filter:drop-shadow(0 4px 10px rgba(0,0,0,.5)); }
#auth.choosing .logo { max-height:9vh; margin-top:0; padding-bottom:6px; }

.panel { display:none; flex-direction:column; gap:12px; width:min(390px,92vw); padding:24px; margin-bottom:auto;
  background:rgba(8,20,44,.86); border:1px solid var(--line); border-radius:24px; backdrop-filter:blur(10px);
  box-shadow:0 12px 44px rgba(0,0,0,.55); }
.panel h1 { margin:0; font-size:27px; font-weight:800; }
.panel h1 b { color:var(--gold); }
.panel p.sub { margin:0 0 4px; font-size:14px; color:var(--mut); line-height:1.4; }
.panel input { font:inherit; font-size:16px; padding:14px 18px; border-radius:999px; border:1px solid var(--line); background:rgba(16,38,74,.65); color:#fff; outline:none; }
.panel input:focus { border-color:var(--gold); }
button.big { font:inherit; font-size:17px; font-weight:800; padding:15px; border:0; border-radius:999px; cursor:pointer; color:#111;
  background:linear-gradient(180deg,#ffd84d,#ffb800); box-shadow:0 4px 16px rgba(255,184,0,.4); }
button.big:active { transform:translateY(1px); }
button.alt { font:inherit; font-size:16px; font-weight:600; padding:13px; border-radius:999px; cursor:pointer; color:#fff; background:rgba(16,38,74,.55); border:1px solid var(--line); }
button.soc { font:inherit; font-size:15px; padding:12px; border-radius:999px; color:var(--mut); background:transparent; border:1px dashed var(--line); cursor:not-allowed; }
.or { display:flex; align-items:center; gap:10px; color:var(--mut); font-size:12px; }
.or::before, .or::after { content:""; flex:1; height:1px; background:var(--line); }
#authMsg { min-height:20px; font-size:14px; color:#ffd9a0; text-align:center; max-width:90vw; padding-top:8px; text-shadow:0 1px 4px #000; }

/* ---- choose character ---- */
#auth.choosing { overflow:hidden; justify-content:flex-start; padding-bottom:0; }
#pChoose { width:100%; max-width:760px; flex:1; min-height:0; margin:0 auto; border-radius:24px 24px 0 0; border-bottom:0; gap:10px;
  padding:14px 16px calc(14px + env(safe-area-inset-bottom)); }
#pChoose h1 { text-align:center; font-size:24px; }
#pChoose h1::before, #pChoose h1::after { content:"━"; color:var(--gold); font-size:12px; margin:0 10px; vertical-align:middle; }
.body { flex:1; min-height:0; display:flex; flex-direction:column; gap:10px; }
.side { display:flex; flex-direction:column; gap:10px; }
.tabs { display:flex; gap:8px; }
.tabs button { flex:1; font:inherit; font-size:16px; font-weight:700; padding:11px; border-radius:14px; cursor:pointer; border:2px solid var(--line); background:rgba(16,38,74,.65); color:#fff; }
#tabMale::before { content:"♂ "; color:#4aa3ff; } #tabFemale::before { content:"♀ "; color:#ff4fa3; }
.tabs button.on { border-color:var(--gold); color:var(--gold); background:var(--navy2); box-shadow:0 0 12px rgba(255,198,26,.3); }
#stage { flex:1; min-height:110px; border-radius:18px; overflow:hidden; border:1px solid var(--line);
  background:radial-gradient(ellipse at 50% 92%, #3a74c4 0%, #14305e 50%, #0b1a33 100%); }
#prev { width:100%; height:100%; display:block; }
#cards { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.card { font:inherit; font-size:14px; font-weight:700; padding:16px 6px; border-radius:16px; cursor:pointer; position:relative; color:#fff;
  border:2px solid var(--line); background:linear-gradient(180deg,rgba(24,56,108,.8),rgba(10,24,52,.9)); }
.card.on { border-color:var(--gold); color:var(--gold); box-shadow:0 0 16px rgba(255,198,26,.45); }
.card.on::after { content:"✔"; position:absolute; top:-9px; right:-7px; width:22px; height:22px; border-radius:50%; background:var(--gold); color:#111; font-size:12px; line-height:22px; }
.perks { display:flex; justify-content:space-around; font-size:12px; color:var(--mut); border-top:1px solid var(--line); padding-top:10px; }
.perks span::before { content:"★ "; color:var(--gold); }

/* ================= HUD (under #auth; appears when #auth is hidden) ================= */
#hud { position:fixed; inset:0; z-index:5; pointer-events:none; color:var(--txt); --u:min(1vw, 1.6vh); }
.hud { left:calc(clamp(84px,24vh,130px) + 22px) !important; }
.glass { background:rgba(8,20,44,.82); border:1px solid var(--line); border-radius:16px; backdrop-filter:blur(6px); }

#mini { position:absolute; top:calc(8px + env(safe-area-inset-top)); left:calc(10px + env(safe-area-inset-left)); width:clamp(84px, 24vh, 130px); aspect-ratio:648/673; }
#mini canvas { position:absolute; left:6%; top:11%; width:88%; height:88%; border-radius:50%; background:radial-gradient(circle,#1f4a8a,#0b1a33); }
#mini img { position:absolute; inset:0; width:100%; height:100%; }
#mini .ic { position:absolute; width:24%; aspect-ratio:1; display:grid; place-items:center; font-size:calc(var(--u)*2.4); }
#mini .ic img { width:100%; height:100%; filter:drop-shadow(0 2px 3px rgba(0,0,0,.6)); }
#mini .ic.a { left:2%; top:46%; } #mini .ic.b { right:2%; top:38%; } #mini .ic.c { left:38%; bottom:0; }

#tr { position:absolute; top:calc(8px + env(safe-area-inset-top)); right:calc(10px + env(safe-area-inset-right)); padding:9px 14px; width:clamp(160px, 42vw, 230px); display:grid; gap:7px; font-weight:700; font-size:clamp(12px,2.2vh,15px); }
#tr .row { display:flex; align-items:center; gap:8px; }
#tr .cash { font-size:1.2em; }
.bar, .sbar { flex:1; height:9px; border-radius:6px; background:linear-gradient(180deg,#050c1c,#0e1d3c); box-shadow:inset 0 1px 3px rgba(0,0,0,.8), 0 0 0 1px rgba(80,130,220,.35); overflow:hidden; }
.bar i, .sbar i { display:block; height:100%; border-radius:6px; transition:width .3s; position:relative; background:linear-gradient(90deg, color-mix(in srgb,var(--c) 75%,#000), var(--c) 70%, color-mix(in srgb,var(--c) 70%,#fff)); box-shadow:0 0 8px var(--c); }
.bar i::after, .sbar i::after { content:""; position:absolute; left:0; right:0; top:0; height:48%; border-radius:6px 6px 0 0; background:linear-gradient(180deg,rgba(255,255,255,.65),rgba(255,255,255,.05)); }
#tr .ri { width:26px; height:26px; flex:none; filter:drop-shadow(0 1px 2px rgba(0,0,0,.6)); }
#tr .am { display:none; }

#stats { position:absolute; left:calc(10px + env(safe-area-inset-left)); bottom:calc(8px + env(safe-area-inset-bottom)); width:min(400px, 52vw);
  display:grid; grid-template-columns:1fr 1px 1fr; gap:0 10px; padding:8px 12px 10px; border-radius:18px;
  background:linear-gradient(180deg,rgba(13,36,78,.92),rgba(6,16,38,.94)); border:2px solid #1f5fc4; box-shadow:0 0 14px rgba(47,139,255,.35), inset 0 0 12px rgba(47,139,255,.15); }
#stats .div { background:linear-gradient(180deg,transparent,#2f6fd0,transparent); }
#stats .col { display:flex; flex-direction:column; gap:7px; justify-content:flex-end; }
#stats .head { display:flex; align-items:center; gap:8px; margin-bottom:2px; }
#av { position:relative; width:48px; height:48px; flex:none; }
#av .face { position:absolute; inset:13%; border-radius:50%; background:#1b3d78 center/cover; display:grid; place-items:center; font-size:20px; }
#av img { position:absolute; inset:0; width:100%; height:100%; }
#stats .who { line-height:1.15; font-weight:800; font-size:13px; } #hudLevel { color:#fff; display:block; } #hudRole { color:#35c8ff; font-size:12px; font-weight:700; }
.st { display:grid; grid-template-columns:26px 1fr; gap:0 6px; align-items:center; }
.st .ico { width:26px; height:auto; filter:drop-shadow(0 1px 2px rgba(0,0,0,.6)); }
.st .lab { display:flex; justify-content:space-between; font-size:10.5px; font-weight:600; color:#cfe0ff; line-height:1.1; }
.st .lab b { color:#fff; font-weight:700; }
.st .sbar { height:7px; margin-top:3px; background:rgba(255,255,255,.16); }
#dock { position:absolute; left:50%; bottom:0; transform:translateX(-50%); width:clamp(190px, 50vh, 300px); aspect-ratio:620/292; }
#dock img { width:100%; height:100%; display:block; pointer-events:none; }
#dock button { position:absolute; transform:translate(-50%,-50%); border:0; background:transparent; border-radius:50%; cursor:pointer; pointer-events:auto; }
#btnBag { left:20.5%; top:69.2%; width:19%; aspect-ratio:1; }
#btnPhone { left:50%; top:44.5%; width:38%; aspect-ratio:1; }
#btnSettings { left:79.8%; top:69.2%; width:19%; aspect-ratio:1; }
#dock button:active { background:rgba(255,198,26,.25); }

/* portrait phones: dock to the right of the stats card isn't possible, so stack */
@media (orientation:portrait) {
  #stats { width:calc(100vw - 20px); bottom:calc(min(62vw,300px)*0.471 + 12px + env(safe-area-inset-bottom)); }
  #dock { width:min(62vw,300px); }
}
/* landscape phones: everything must fit short screens */
@media (orientation:landscape) and (max-height:600px) {
  #auth { flex-direction:row; flex-wrap:wrap; justify-content:center; align-content:center; align-items:center; gap:4px 30px; overflow-y:auto; }
  .logo { width:min(38vw,360px); max-height:60vh; margin:0; padding:0; }
  .panel { margin:0; width:min(380px,50vw); padding:16px; gap:8px; }
  .panel h1 { font-size:21px; } .panel p.sub { display:none; } .panel input { padding:10px 16px; font-size:15px; }
  button.big { padding:11px; font-size:15px; } button.alt { padding:10px; font-size:14px; } button.soc { padding:8px; font-size:13px; }
  #authMsg { width:100%; padding:0; min-height:16px; }
  #auth.choosing { flex-direction:column; flex-wrap:nowrap; gap:0; }
  #auth.choosing .logo { display:none; }
  #pChoose { max-width:900px; padding:10px 14px calc(8px + env(safe-area-inset-bottom)); gap:6px; border-radius:18px 18px 0 0; }
  #pChoose h1 { font-size:18px; }
  .body { flex-direction:row; gap:14px; } #stage { flex:1.1; min-height:0; } .side { flex:1; justify-content:center; }
  .perks { display:none; } .card { padding:12px 4px; }
  #stats { width:min(380px, calc(50vw - 96px)); padding:6px 10px 8px; gap:0 8px; } #stats .col { gap:5px; } #av { width:40px; height:40px; } .st .ico { width:21px; } .st { grid-template-columns:21px 1fr; } .st .lab { font-size:9.5px; } .st .sbar { height:6px; margin-top:2px; }
  #dock { width:clamp(170px,48vh,240px); }
}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<div id="game"></div>

<!-- ============ IN-GAME HUD ============ -->
<div id="hud">
  <div id="mini"><canvas id="hudMap" width="200" height="200"></canvas><img src="assets/minimap.png" alt="">
    <div class="ic a"><img src="assets/icons/home.png" alt=""></div><div class="ic b"><img src="assets/icons/car.png" alt=""></div><div class="ic c">👕</div></div>
  <div id="tr" class="glass">
    <div class="row cash"><img class="ri" src="assets/icons/cash.png" alt=""><span id="hudCash">₦0</span></div>
    <div class="row"><img class="ri" src="assets/icons/health.png" alt=""><div class="bar"><i id="hudHealth" style="--c:#ff2d3d;width:100%"></i></div><span id="hudHealthTxt">100%</span></div>
    <div class="row"><img class="ri" src="assets/icons/armor.png" alt=""><div class="bar"><i id="hudArmor" style="--c:#2f8bff;width:0"></i></div><span id="hudArmorTxt">0%</span></div>
    <div class="row am"><img class="ri" src="assets/icons/ammo.png" alt=""><span id="hudAmmo">0 / 0</span></div>
  </div>
  <div id="stats" class="glass">
    <div class="col" id="colL">
      <div class="head"><div id="av"><div class="face" id="hudFace">🙂</div><img src="assets/avatar.png" alt=""></div>
        <div class="who"><span id="hudLevel">Lv. 1</span><span id="hudRole">Civilian</span></div></div>
    </div>
    <div class="div"></div>
    <div class="col" id="colR"></div>
  </div>
  <div id="dock"><img src="assets/dock.png" alt="">
    <button id="btnBag" aria-label="Inventory"></button><button id="btnPhone" aria-label="Phone"></button><button id="btnSettings" aria-label="Settings"></button></div>
</div>

<!-- ============ LOGIN / SIGN UP / CHOOSE CHARACTER ============ -->
<div id="auth">
<img class="logo" src="assets/logo.png" alt="NaijaVerse RP">

<div class="panel" id="pLanding">
<h1>Welcome <b>Back!</b></h1>
<p class="sub">Log in to continue your NaijaVerse journey and explore a world of endless possibilities.</p>
<input id="authEmail" type="email" autocomplete="email" placeholder="Email or Username">
<input id="authPass" type="password" autocomplete="current-password" placeholder="Password">
<button class="big" id="btnLogin">Log In →</button>
<div class="or">OR</div>
<button class="alt" id="btnCreate">Create New Account</button>
</div>

<div class="panel" id="pSignup">
<h1>Create your <b>account</b></h1>
<p class="sub">Enter your email and password above, then continue.</p>
<button class="big" id="btnSignup">Continue →</button>
<div class="or">OR</div>
<button class="soc" disabled>Sign in with Google (soon)</button>
<button class="soc" disabled>Sign in with Facebook (soon)</button>
<button class="alt" id="btnBack">Back</button>
</div>

<div class="panel" id="pChoose">
<h1>Choose Your <b>Character</b></h1>
<div class="body">
  <div id="stage"><canvas id="prev"></canvas></div>
  <div class="side">
    <div class="tabs"><button id="tabMale">Male</button><button id="tabFemale">Female</button></div>
    <div id="cards"></div>
    <button class="big" id="btnPlay">Play</button>
    <div class="perks"><span>Build Your Story</span><span>Make New Friends</span><span>Explore Endlessly</span></div>
  </div>
</div>
</div>
<div id="authMsg"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<!-- HUD API: call NaijaHUD.set({...}) from game.js whenever player data changes -->
<script>
(function () {
  var defs = [["social","Social","#ff3fa4","social","L"],["energy","Energy","#ffc61a","energy","L"],["hunger","Hunger","#ff8a2a","hunger","L"],
              ["thirst","Thirst","#25a8ff","thirst","R"],["hygiene","Hygiene","#3ad0ff","hygiene","R"],["pee","Pee","#8a5cff","pee","R"],["stress","Mental Stress","#e04bff","stress","R"]];
  defs.forEach(function (d) {
    document.getElementById("col" + d[4]).insertAdjacentHTML("beforeend",
      '<div class="st"><img class="ico" src="assets/icons/'+d[3]+'.png" alt=""><div><div class="lab"><span>'+d[1]+'</span><b id="st_'+d[0]+'t">100%</b></div><div class="sbar"><i id="st_'+d[0]+'" style="--c:'+d[2]+';width:100%"></i></div></div></div>');
  });
  function bar(id, txt, v) { v = Math.max(0, Math.min(100, v)); document.getElementById(id).style.width = v + "%"; document.getElementById(txt).textContent = Math.round(v) + "%"; }
  window.NaijaHUD = { set: function (o) {
    if (o.cash != null) document.getElementById("hudCash").textContent = "₦" + Number(o.cash).toLocaleString();
    if (o.health != null) bar("hudHealth", "hudHealthTxt", o.health);
    if (o.armor != null) bar("hudArmor", "hudArmorTxt", o.armor);
    if (o.ammo != null) { document.querySelector("#tr .am").style.display = "flex"; document.getElementById("hudAmmo").textContent = o.ammo; }
    if (o.level != null) document.getElementById("hudLevel").textContent = "Lv. " + o.level;
    if (o.role) document.getElementById("hudRole").textContent = o.role;
    if (o.avatar) { var f = document.getElementById("hudFace"); f.style.backgroundImage = "url(" + o.avatar + ")"; f.textContent = ""; }
    if (o.stats) Object.keys(o.stats).forEach(function (k) { if (document.getElementById("st_" + k)) bar("st_" + k, "st_" + k + "t", o.stats[k]); });
  } };
  NaijaHUD.set({ cash:250000, health:100, armor:0, level:12, stats:{ social:100, energy:85, hunger:70, thirst:65, hygiene:80, pee:60, stress:20 } }); // demo values: remove later
  [["btnBag","nv:inventory"],["btnPhone","nv:phone"],["btnSettings","nv:settings"]].forEach(function (b) {
    document.getElementById(b[0]).addEventListener("click", function () { window.dispatchEvent(new CustomEvent(b[1])); });
  });
})();
</script>
<script type="module" src="game.js"></script>
</body>
</html>
