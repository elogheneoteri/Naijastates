<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>NaijaVerse RP</title>
<style>
  html, body { margin: 0; height: 100%; background: #14202b; overflow: hidden; font-family: Georgia, serif; }
  #game { width: 100%; height: 100%; touch-action: none; }
  #game canvas { display: block; }
  #auth {
    position: fixed; inset: 0; z-index: 10; display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px; overflow-y: auto; padding: 16px; box-sizing: border-box;
    background: radial-gradient(ellipse at top, #24435c, #0d1620 70%); color: #f3eedd;
  }
  #auth .logo { font-size: 38px; font-weight: bold; color: #fff; text-shadow: 0 2px 0 #000; }
  #auth .logo b { color: #ffd23f; }
  #auth .logo small { display: block; font-size: 16px; color: #ffd23f; text-align: right; }
  .panel { display: none; flex-direction: column; gap: 10px; width: min(360px, 90vw); padding: 22px; box-sizing: border-box;
    background: #1d2f3e; border: 1px solid #3a566d; border-radius: 12px; }
  #pChoose { width: min(760px, 96vw); }
  .panel h1 { margin: 0 0 4px; font-size: 22px; font-weight: normal; }
  .panel h1 b { color: #ffd23f; }
  .panel input { font: inherit; font-size: 16px; padding: 10px; border-radius: 6px; border: 1px solid #3a566d; background: #14202b; color: #fff; }
  .panel label { font-size: 13px; color: #b9c7d2; }
  button.big { font: inherit; font-size: 16px; padding: 12px; border: 0; border-radius: 24px; background: #ffd23f; color: #111; font-weight: bold; cursor: pointer; }
  button.alt { font: inherit; font-size: 16px; padding: 12px; border-radius: 24px; background: transparent; color: #fff; border: 1px solid #3a566d; cursor: pointer; }
  #authMsg { min-height: 20px; font-size: 14px; color: #ffd9a0; text-align: center; max-width: 90vw; }
  .tabs { display: flex; gap: 8px; }
  .tabs button { flex: 1; font: inherit; padding: 10px; border-radius: 8px; border: 1px solid #3a566d; background: #14202b; color: #fff; cursor: pointer; }
  .tabs button.on { border-color: #ffd23f; color: #ffd23f; }
  .chooseRow { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  #prev { width: 260px; height: 340px; border-radius: 10px; background: #14202b; }
  .side { flex: 1; min-width: 220px; display: flex; flex-direction: column; gap: 8px; }
  #cards { display: flex; gap: 8px; flex-wrap: wrap; }
  .card { font: inherit; padding: 10px 12px; border-radius: 8px; border: 2px solid #3a566d; background: #14202b; color: #fff; cursor: pointer; }
  .card.on { border-color: #ffd23f; }
  .colourRow { display: flex; flex-direction: column; gap: 4px; }
  .sws { display: flex; gap: 5px; flex-wrap: wrap; }
  .sw { width: 28px; height: 28px; border-radius: 50%; border: 2px solid #3a566d; cursor: pointer; padding: 0; color: #fff; font-size: 12px; }
  .sw.on { border-color: #fff; box-shadow: 0 0 0 2px #ffd23f; }
</style>

<!-- Three.js (the 3D engine) is loaded from the internet, no install needed -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="game"></div>

<div id="auth">
  <div class="logo">Naija<b>Verse</b><small>RP</small></div>

  <div class="panel" id="pLanding">
    <h1>Welcome <b>Back!</b></h1>
    <label for="authEmail">Email</label>
    <input id="authEmail" type="email" autocomplete="email">
    <label for="authPass">Password</label>
    <input id="authPass" type="password" autocomplete="current-password">
    <button class="big" id="btnLogin">Log In</button>
    <button class="alt" id="btnCreate">Create New Account</button>
  </div>

  <div class="panel" id="pSignup">
    <h1>Create your <b>account</b></h1>
    <label>Use the email and password above</label>
    <button class="big" id="btnSignup">Continue</button>
    <button class="alt" id="btnBack">Back</button>
  </div>

  <div class="panel" id="pChoose">
    <h1>Choose Your <b>Character</b></h1>
    <div class="tabs"><button id="tabMale">Male</button><button id="tabFemale">Female</button></div>
    <div class="chooseRow">
      <canvas id="prev" width="260" height="340"></canvas>
      <div class="side">
        <div id="cards"></div>
        <div class="colourRow"><label>Top</label><div class="sws" id="swTop"></div></div>
        <div class="colourRow"><label>Trousers</label><div class="sws" id="swBottom"></div></div>
        <div class="colourRow"><label>Shoes</label><div class="sws" id="swShoes"></div></div>
        <div class="colourRow" id="rowHair"><label>Hair</label><div class="sws" id="swHair"></div></div>
      </div>
    </div>
    <button class="big" id="btnPlay">Play</button>
  </div>

  <div id="authMsg"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script type="module" src="game.js"></script>
</body>
</html>
