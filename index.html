<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Delta Walk 3D</title>
<style>
  html, body { margin: 0; height: 100%; background: #14202b; overflow: hidden; font-family: Georgia, serif; }
  #game { width: 100%; height: 100%; touch-action: none; }
  #game canvas { display: block; }
  #auth {
    position: fixed; inset: 0; z-index: 10; display: none;
    align-items: center; justify-content: center; background: #14202b;
  }
  #auth .card {
    width: min(360px, 90vw); display: flex; flex-direction: column; gap: 10px;
    padding: 22px; background: #1d2f3e; border: 1px solid #3a566d; border-radius: 10px; color: #f3eedd;
  }
  #auth h1 { margin: 0 0 4px; font-size: 22px; font-weight: normal; }
  #auth input {
    font: inherit; font-size: 16px; padding: 10px; border-radius: 6px;
    border: 1px solid #3a566d; background: #14202b; color: #fff;
  }
  #auth .row { display: flex; gap: 10px; }
  #auth button {
    flex: 1; font: inherit; font-size: 16px; padding: 10px; border: 0; border-radius: 6px;
    background: #2c6e9b; color: #fff; cursor: pointer;
  }
  #auth button.alt { background: #3a566d; }
  #auth #authMsg { min-height: 20px; font-size: 14px; color: #ffd9a0; }
  #auth label { font-size: 13px; color: #b9c7d2; }
</style>

<!-- Three.js (the 3D engine) is loaded from the internet, no install needed -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="game"></div>

<div id="auth">
  <div class="card">
    <h1>Delta Walk 3D</h1>
    <label for="authName">Display name (used when you sign up)</label>
    <input id="authName" type="text" maxlength="16" autocomplete="nickname">
    <label for="authEmail">Email</label>
    <input id="authEmail" type="email" autocomplete="email">
    <label for="authPass">Password (at least 6 characters)</label>
    <input id="authPass" type="password" autocomplete="current-password">
    <div class="row">
      <button id="btnLogin">Log in</button>
      <button id="btnSignup" class="alt">Sign up</button>
    </div>
    <div id="authMsg"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script type="module" src="game.js"></script>
</body>
</html>
