<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>NaijaVerse RP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap">
<link rel="stylesheet" href="hud.css?v=1">
<style>
:root { --navy:#0b1a33; --navy2:#10264a; --line:#1f4a8a; --gold:#ffc61a; --txt:#f3f6ff; --mut:#9fb3d1; }
* { box-sizing:border-box; }
html, body { margin:0; height:100%; background:#0b1a33; overflow:hidden; font-family:"Segoe UI", system-ui, Arial, sans-serif; }
#game { width:100%; height:100%; touch-action:none; }
#game canvas { display:block; }

/* ================= AUTH ================= */
#auth { position:fixed; inset:0; z-index:10; display:none; flex-direction:column; align-items:center; overflow-y:auto; color:var(--txt);
  padding:calc(12px + env(safe-area-inset-top)) 14px 12px;
  background:linear-gradient(180deg, rgba(11,26,51,0) 40%, rgba(11,26,51,.75) 100%), url("assets/icons/bg.jpg") center bottom / cover no-repeat #0b1a33; }
.logo { width:min(86vw,520px); max-height:24vh; object-fit:contain; margin-top:auto; padding-bottom:14px; filter:drop-shadow(0 4px 10px rgba(0,0,0,.5)); }
#auth.choosing .logo { max-height:9vh; margin-top:0; padding-bottom:6px; }

.panel { display:none; flex-direction:column; gap:12px; width:min(390px,92vw); padding:24px; margin-bottom:auto;
  background:rgba(8,20,44,.86); border:1px solid var(--line); border-radius:24px; backdrop-filter:blur(10px);
  box-shadow:0 12px 44px rgba(0,0,0,.55); }
.panel h1 { margin:0; font-size:27px; font-weight:800; }
.panel h1 b { color:var(--gold); }
.panel p.sub { margin:0 0 4px; font-size:14px; color:var(--mut); line-height:1.4; }
.panel input { font:inherit; font-size:16px; padding:14px 18px; border-radius:999px; border:1px solid var(--line); background:rgba(16,38,74,.65); color:#fff; outline:none; }
.panel input:focus { border-color:var(--gold); }
button.big { font:inherit; font-size:17px; font-weight:800; padding:15px; border:0; border-radius:999px; cursor:pointer; color:#111;
  background:linear-gradient(180deg,#ffd84d,#ffb800); box-shadow:0 4px 16px rgba(255,184,0,.4); }
button.big:active { transform:translateY(1px); }
button.alt { font:inherit; font-size:16px; font-weight:600; padding:13px; border-radius:999px; cursor:pointer; color:#fff; background:rgba(16,38,74,.55); border:1px solid var(--line); }
button.soc { font:inherit; font-size:15px; padding:12px; border-radius:999px; color:var(--mut); background:transparent; border:1px dashed var(--line); cursor:not-allowed; }
.or { display:flex; align-items:center; gap:10px; color:var(--mut); font-size:12px; }
.or::before, .or::after { content:""; flex:1; height:1px; background:var(--line); }
#authMsg { min-height:20px; font-size:14px; color:#ffd9a0; text-align:center; max-width:90vw; padding-top:8px; text-shadow:0 1px 4px #000; }

/* ---- choose character ---- */
#auth.choosing { overflow:hidden; justify-content:flex-start; padding-bottom:0; }
#pChoose { width:100%; max-width:760px; flex:1; min-height:0; margin:0 auto; border-radius:24px 24px 0 0; border-bottom:0; gap:10px;
  padding:14px 16px calc(14px + env(safe-area-inset-bottom)); }
#pChoose h1 { text-align:center; font-size:24px; }
#pChoose h1::before, #pChoose h1::after { content:"━"; color:var(--gold); font-size:12px; margin:0 10px; vertical-align:middle; }
.body { flex:1; min-height:0; display:flex; flex-direction:column; gap:10px; }
.side { display:flex; flex-direction:column; gap:10px; }
.tabs { display:flex; gap:8px; }
.tabs button { flex:1; font:inherit; font-size:16px; font-weight:700; padding:11px; border-radius:14px; cursor:pointer; border:2px solid var(--line); background:rgba(16,38,74,.65); color:#fff; }
#tabMale::before { content:"♂ "; color:#4aa3ff; } #tabFemale::before { content:"♀ "; color:#ff4fa3; }
.tabs button.on { border-color:var(--gold); color:var(--gold); background:var(--navy2); box-shadow:0 0 12px rgba(255,198,26,.3); }
#stage { flex:1; min-height:110px; border-radius:18px; overflow:hidden; border:1px solid var(--line);
  background:radial-gradient(ellipse at 50% 92%, #3a74c4 0%, #14305e 50%, #0b1a33 100%); }
#prev { width:100%; height:100%; display:block; }
#cards { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.card { font:inherit; font-size:14px; font-weight:700; padding:16px 6px; border-radius:16px; cursor:pointer; position:relative; color:#fff;
  border:2px solid var(--line); background:linear-gradient(180deg,rgba(24,56,108,.8),rgba(10,24,52,.9)); }
.card.on { border-color:var(--gold); color:var(--gold); box-shadow:0 0 16px rgba(255,198,26,.45); }
.card.on::after { content:"✔"; position:absolute; top:-9px; right:-7px; width:22px; height:22px; border-radius:50%; background:var(--gold); color:#111; font-size:12px; line-height:22px; }
.perks { display:flex; justify-content:space-around; font-size:12px; color:var(--mut); border-top:1px solid var(--line); padding-top:10px; }
.perks span::before { content:"★ "; color:var(--gold); }

/* landscape phones: everything must fit short screens */
@media (orientation:landscape) and (max-height:600px) {
  #auth { flex-direction:row; flex-wrap:wrap; justify-content:center; align-content:center; align-items:center; gap:4px 30px; overflow-y:auto; }
  .logo { width:min(38vw,360px); max-height:60vh; margin:0; padding:0; }
  .panel { margin:0; width:min(380px,50vw); padding:16px; gap:8px; }
  .panel h1 { font-size:21px; } .panel p.sub { display:none; } .panel input { padding:10px 16px; font-size:15px; }
  button.big { padding:11px; font-size:15px; } button.alt { padding:10px; font-size:14px; } button.soc { padding:8px; font-size:13px; }
  #authMsg { width:100%; padding:0; min-height:16px; }
  #auth.choosing { flex-direction:column; flex-wrap:nowrap; gap:0; }
  #auth.choosing .logo { display:none; }
  #pChoose { max-width:900px; padding:10px 14px calc(8px + env(safe-area-inset-bottom)); gap:6px; border-radius:18px 18px 0 0; }
  #pChoose h1 { font-size:18px; }
  .body { flex-direction:row; gap:14px; } #stage { flex:1.1; min-height:0; } .side { flex:1; justify-content:center; }
  .perks { display:none; } .card { padding:12px 4px; }
}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<div id="game"></div>

<!-- ============ IN-GAME HUD (screen-space overlay; styled by hud.css, driven by hud.js) ============ -->
<div id="hud">

  <!-- 1. minimap : top-left -->
  <div id="mini">
    <div class="m-ring"><div class="m-in">
      <canvas id="hudMap" width="256" height="256"></canvas>
      <svg id="hudArrow" viewBox="0 0 30 30" aria-hidden="true"><polygon points="15,1 27,28 15,21 3,28" fill="#4cc9ff" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>
    </div></div>
    <span class="m-n">N</span>
    <div class="m-b b-home"><img src="assets/icons/home.png" alt="" onerror="this.style.visibility='hidden'"></div>
    <div class="m-b b-car"><img src="assets/icons/car.png" alt="" onerror="this.style.visibility='hidden'"></div>
    <div class="m-b b-shirt"><svg viewBox="0 0 28 28" aria-hidden="true"><path fill="#7fd3ff" d="M9 3 2 8l3.4 5L8 11.4V25h12V11.4l2.6 1.6L26 8l-7-5c-.8 2-2.4 3.2-5 3.2S9.8 5 9 3z"/></svg></div>
  </div>

  <!-- zone / online / test / logout : under the minimap -->
  <div id="info">
    <div class="i-row"><div id="zoneText" class="chip">Walking</div><div id="statusText" class="chip"></div></div>
    <button id="testButton" class="ibtn" style="display:none"></button>
    <button id="logoutButton" class="ibtn out">Log out</button>
  </div>

  <!-- 2. money + vitals : top-right -->
  <div id="tr">
    <div class="row cash"><img src="assets/icons/cash.png" alt="" onerror="this.style.visibility='hidden'"><span id="hudCash">₦0</span></div>
    <div class="row"><img src="assets/icons/health.png" alt="" onerror="this.style.visibility='hidden'"><div class="hbar"><i id="hudHealth" style="--c:#ff2d3d;width:100%"></i></div><span class="pct" id="hudHealthTxt">100%</span></div>
    <div class="row"><img src="assets/icons/armor.png" alt="" onerror="this.style.visibility='hidden'"><div class="hbar"><i id="hudArmor" style="--c:#2f8bff;width:0"></i></div><span class="pct" id="hudArmorTxt">0%</span></div>
  </div>

  <!-- 3. player stats : bottom-left -->
  <div id="stats">
    <div class="col" id="colL">
      <div class="head">
        <div id="av"><div id="hudFace">🙂</div><img id="hudFrame" src="assets/icons/avatar.png" alt="" onerror="this.style.display='none'"></div>
        <div class="who"><span id="hudLevel">Lv. 1</span><span id="hudRole">Civilian</span></div>
      </div>
    </div>
    <div class="vdiv"></div>
    <div class="col" id="colR"></div>
  </div>

  <!-- 4. phone control : bottom-center, flush with the bottom edge -->
  <div id="dock">
    <svg viewBox="0 0 330 142" aria-hidden="true" style="font-family:inherit">
      <defs>
        <linearGradient id="dkBody" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16397a"/><stop offset="1" stop-color="#071531"/></linearGradient>
        <linearGradient id="dkGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd35a"/><stop offset=".55" stop-color="#d98a0b"/><stop offset="1" stop-color="#ffb92e"/></linearGradient>
        <radialGradient id="dkBtn" cx=".35" cy=".3" r=".9"><stop offset="0" stop-color="#1f4f9a"/><stop offset="1" stop-color="#081a3d"/></radialGradient>
      </defs>
      <path d="M2 142 C2 80 62 40 165 40 C268 40 328 80 328 142 Z" fill="url(#dkBody)"/>
      <path d="M14 142 C14 88 70 52 165 52 C260 52 316 88 316 142" fill="none" stroke="rgba(90,150,255,.28)" stroke-width="1.5"/>
      <path d="M2 142 C2 80 62 40 165 40 C268 40 328 80 328 142" fill="none" stroke="url(#dkGold)" stroke-width="3.5"/>
      <circle cx="68" cy="98" r="27" fill="url(#dkBtn)" stroke="url(#dkGold)" stroke-width="3"/>
      <circle cx="262" cy="98" r="27" fill="url(#dkBtn)" stroke="url(#dkGold)" stroke-width="3"/>
      <circle cx="165" cy="58" r="56" fill="url(#dkBtn)" stroke="url(#dkGold)" stroke-width="3.5"/>
      <!-- phone -->
      <g transform="translate(165 46)" fill="none" stroke="#eaf2ff" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round">
        <rect x="-12" y="-22" width="24" height="40" rx="5"/><line x1="-4" y1="-16" x2="4" y2="-16"/><circle cx="0" cy="12" r="1.6" fill="#eaf2ff" stroke="none"/>
      </g>
      <text x="165" y="92" text-anchor="middle" font-size="15" font-weight="600" fill="#fff" style="font-family:inherit">Phone</text>
      <!-- backpack -->
      <g transform="translate(68 98)" fill="none" stroke="#eaf2ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-5 -12v-2a5 5 0 0 1 10 0v2"/><rect x="-11" y="-12" width="22" height="25" rx="8"/><rect x="-6" y="1" width="12" height="8" rx="2.5"/><path d="M-11 -2h-3v9M11 -2h3v9"/>
      </g>
      <!-- gear -->
      <g transform="translate(262 98)" fill="#eaf2ff">
        <path d="M-2.8 -15h5.6v8h-5.6zM-2.8 7h5.6v8h-5.6z"/>
        <path transform="rotate(45)" d="M-2.8 -15h5.6v8h-5.6zM-2.8 7h5.6v8h-5.6z"/>
        <path transform="rotate(90)" d="M-2.8 -15h5.6v8h-5.6zM-2.8 7h5.6v8h-5.6z"/>
        <path transform="rotate(135)" d="M-2.8 -15h5.6v8h-5.6zM-2.8 7h5.6v8h-5.6z"/>
        <circle r="10.5" fill="none" stroke="#eaf2ff" stroke-width="4.5"/><circle r="3.4" fill="none" stroke="#eaf2ff" stroke-width="2.4"/>
      </g>
    </svg>
    <button id="btnBag" aria-label="Inventory"></button><button id="btnPhone" aria-label="Phone"></button><button id="btnSettings" aria-label="Settings"></button>
  </div>
</div>

<!-- ============ LOGIN / SIGN UP / CHOOSE CHARACTER ============ -->
<div id="auth">
<img class="logo" src="assets/icons/logo.png" alt="NaijaVerse RP" onerror="if(!this.dataset.t){this.dataset.t=1;this.src='assets/logo.png';}">

<div class="panel" id="pLanding">
<h1>Welcome <b>Back!</b></h1>
<p class="sub">Log in to continue your NaijaVerse journey and explore a world of endless possibilities.</p>
<input id="authEmail" type="email" autocomplete="email" placeholder="Email or Username">
<input id="authPass" type="password" autocomplete="current-password" placeholder="Password">
<button class="big" id="btnLogin">Log In →</button>
<div class="or">OR</div>
<button class="alt" id="btnCreate">Create New Account</button>
</div>

<div class="panel" id="pSignup">
<h1>Create your <b>account</b></h1>
<p class="sub">Enter your email and password above, then continue.</p>
<button class="big" id="btnSignup">Continue →</button>
<div class="or">OR</div>
<button class="soc" disabled>Sign in with Google (soon)</button>
<button class="soc" disabled>Sign in with Facebook (soon)</button>
<button class="alt" id="btnBack">Back</button>
</div>

<div class="panel" id="pChoose">
<h1>Choose Your <b>Character</b></h1>
<div class="body">
  <div id="stage"><canvas id="prev"></canvas></div>
  <div class="side">
    <div class="tabs"><button id="tabMale">Male</button><button id="tabFemale">Female</button></div>
    <div id="cards"></div>
    <button class="big" id="btnPlay">Play</button>
    <div class="perks"><span>Build Your Story</span><span>Make New Friends</span><span>Explore Endlessly</span></div>
  </div>
</div>
</div>
<div id="authMsg"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script src="hud.js?v=1"></script>
<script type="module" src="game.js?v=1"></script>
</body>
</html>
